name: Dependabot auto-merge

# research(2026-06): auto-merge Dependabot patch bumps (any ecosystem) and any
# github-actions bump (patch/minor/major). GitHub Actions are CI-only, SHA-pinned, and
# the build validates them, so even a major action bump is safe to land on green; patch
# is non-breaking by semver. dependabot.yml already holds new releases for a 7-day
# supply-chain cooldown, and main's required checks gate every merge. Language-dependency
# minors and majors (uv) still wait for a person. A grouped PR reports its HIGHEST bump,
# so a non-action group containing any minor holds for review.
#
# GITHUB_TOKEN (elevated via permissions), not a GitHub App token: a Dependabot-triggered
# run reads only the Dependabot secrets store, not Actions secrets. A GITHUB_TOKEN merge
# does not re-fire push-triggered workflows, so a docs-affecting bump deploys on the next
# push to the docs paths rather than instantly.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Dependabot's own PRs only; skipped (non-blocking) on every other PR.
    # pull_request.user.login (not the spoofable github.actor) is the robust gate.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'ajbarea/keryx'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Arm auto-merge (patch any-ecosystem, or any github-actions bump)
        # fetch-metadata reports the ecosystem with an underscore (github_actions),
        # not dependabot.yml's hyphenated spelling; a hyphen here never matches.
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch'
          || steps.meta.outputs.package-ecosystem == 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
