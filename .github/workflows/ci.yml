name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ruff prints lint and format findings as annotations on the PR's changed lines. Set here
# rather than as a flag, so `make lint` stays the same command locally and in CI.
env:
  RUFF_OUTPUT_FORMAT: github

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # python-version sets UV_PYTHON, which beats .python-version; setup-python would not.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      # No `cuda` extra: the suite never loads Kokoro, and the extra is ~2 GB.
      - run: uv sync --frozen
      - run: make lint
      - run: make test

  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make mod-test
