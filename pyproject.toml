[project]
name = "keryx"
version = "0.3.0"
description = "Gives Claude Code a voice: speaks a one- or two-sentence gist of each reply"
readme = "README.md"
authors = [
    { name = "AJ Barea", email = "ajbareaa@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "kokoro-onnx>=0.6.1",
    # Stands in for kokoro-onnx's CPU-only `onnxruntime` (overridden below); it carries
    # the CPU provider too, so this works without CUDA.
    "onnxruntime-gpu>=1.30.0",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
# The CUDA and cuDNN runtime wheels, ~2 GB; Kokoro runs about 10x faster with them.
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.30.0"]

[project.scripts]
keryx = "keryx.__main__:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.uv]
# Two onnxruntime distributions in one venv overwrite each other's files.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
